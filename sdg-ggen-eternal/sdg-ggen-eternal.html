<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD高達G世代永恆 收藏管理庫</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/filters.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/autocomplete.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/reorder.css">
<link rel="stylesheet" href="css/dark-mode.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>SD高達G世代永恆 收藏管理庫</h1>
        <p>單位・角色・支援單位・關卡</p>
        <div id="storage-status"></div>
    </div>
 
    <button id="dark-mode-toggle" onclick="toggleDarkMode()" title="切換深色模式">☾</button>
 
    <!-- ================= 資料管理工具列（全分頁共用） ================= -->
    <div class="toolbar">
        <span style="font-size:11px;font-weight:bold;color:#2c3e50;">📦 資料管理：</span>
        <button class="btn btn-success" onclick="exportData()">匯出 JSON</button>
        <button class="btn btn-success" onclick="importData()">匯入 JSON</button>
        <button class="btn btn-info" onclick="saveDbFile()">下載整庫 (.db)</button>
        <button class="btn btn-info" onclick="loadDbFile()">還原整庫 (.db)</button>
        <button class="btn btn-warning" onclick="clearAllData()">清空資料庫</button>
        <span style="border-left:1px solid #ccc;height:20px;"></span>
        <button class="btn btn-info" onclick="openOptionalPartsModal()">🧩 選擇性零件 (OP)</button>
        <button class="btn btn-info" onclick="openStageDataModal()">🎯 關卡資料</button>
        <span style="border-left:1px solid #ccc;height:20px;"></span>
        <button class="btn btn-primary" id="gh-up" onclick="syncToGitHub()">⬆ 上傳至 GitHub</button>
        <button class="btn btn-warning" id="gh-dn" onclick="syncFromGitHub()">⬇ 自 GitHub 下載</button>
        <!-- ★ Auto-sync 開關：控制「編輯後自動上傳」；頁面載入時的自動下載仍會執行（但本地有未上傳變更時會自動略過下載以保護資料） -->
        <label class="autosync-line"
               title="開啟：任何編輯（新增／修改／刪除／排序／匯入／還原／清空）完成後約 1.5 秒自動上傳至 GitHub。關閉：僅能手動上傳。">
            <input type="checkbox" id="auto-sync" checked> Auto-sync
        </label>
        <span class="sync-status" id="sync-status"></span>
    </div>
 
    <div class="tabs">
        <button class="tab active" id="tabbtn-units" onclick="switchTab('units')">🤖 單位</button>
        <button class="tab" id="tabbtn-characters" onclick="switchTab('characters')">👤 角色</button>
        <button class="tab" id="tabbtn-supports" onclick="switchTab('supports')">🛠 支援單位</button>
    </div>
 
    <!-- ================= 單位 分頁 ================= -->
    <div id="tab-units" class="tab-content active"></div>
 
    <!-- ================= 角色 分頁 ================= -->
    <div id="tab-characters" class="tab-content"></div>
 
    <!-- ================= 支援單位 分頁 ================= -->
    <div id="tab-supports" class="tab-content">

 

    </div>
</div>
 
<button id="to-top-button" onclick="scrollToTop()">↑</button>
<div id="toast"></div>
<script src="js/tab-units.js"></script>
<script src="js/tab-characters.js"></script>
<script src="js/tab-supports.js"></script>
<script src="api.js"></script>
<script src="js/GitHub-sync.js"></script>
<script src="js/storage.js"></script>
<script src="js/globals.js"></script>
<script src="js/utils.js"></script>
<script src="js/search-common.js"></script>
<script src="js/search-units.js"></script>
<script src="js/search-characters.js"></script>
<script src="js/search-supports.js"></script>
 
<!-- 2. Logic/Data -->
<script src="js/database.js"></script>
 
<!-- 3. UI Components and Feature Tabs -->
<script src="js/combo.js"></script>
<script src="js/weapon-effect-types.js"></script>
<script src="js/weapon-details.js"></script>
<script src="js/weapon-filters.js"></script>
<script src="js/autocomplete.js"></script>
<script src="js/render-units.js"></script>
<script src="js/render-characters.js"></script>
<script src="js/render-supports.js"></script>
<script src="js/ui.js"></script>
<script src="js/forms.js"></script>
<script src="js/import-export.js"></script>
<script src="js/reorder.js"></script>
<script src="js/optional-parts.js"></script>
<script src="js/stage-data.js"></script>
<!-- 4. Entry Point -->
<script src="js/main.js"></script>
</body>
</html>
